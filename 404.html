<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="refresh" content="0; url=/event-details/" />
  </head>
  <body>
    <script>
      // For GitHub Pages client-side routing
      var base = '/event-details';
      var path = window.location.pathname.replace(/\/+/g, '/');
      if (!path.startsWith(base)) {
        path = base + path;
      }
      // Remove duplicate slashes and ensure single base
      path = path.replace(/\/+/g, '/').replace(base + base, base);
      window.location.replace(path);
    </script>
  </body>
</html>
